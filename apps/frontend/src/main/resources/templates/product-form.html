<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.id == null ? 'Add product' : 'Edit product'}">Product form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=4)}">
</head>
<body>
    <nav class="site-nav">
        <div class="nav-content">
            <a th:href="@{/products}" class="site-logo">
                Vanilla JS Project
            </a>
            <a th:href="@{/products}" class="nav-link">Products</a>
        </div>
    </nav>

    <main class="page-container form-page">
        <header class="page-header">
            <h1 class="page-title" th:text="${product.id == null ? 'Add product' : 'Edit product'}">Product form</h1>
            <p class="page-subtitle">Complete the fields and save the product.</p>
        </header>

        <form th:action="${product.id == null} ? @{/products} : @{/products/{id}(id=${product.id})}"
              th:object="${product}" method="post"
              class="form-card">
            <div class="form-field">
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" maxlength="100" required>
            </div>
            <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <div class="form-field">
                <label for="price">Price</label>
                <input id="price" type="number" th:field="*{price}" min="0" step="0.01" required>
            </div>
            <p class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>

            <div class="form-field">
                <label for="stock">Stock</label>
                <input id="stock" type="number" th:field="*{stock}" min="0" required>
            </div>
            <p class="form-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>

            <div class="form-field">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" maxlength="500" rows="4"></textarea>
            </div>
            <p class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

            <div class="form-actions">
                <a th:href="@{/products}" class="secondary-button">Cancel</a>
                <button type="submit" class="primary-button"
                        th:text="${product.id == null ? 'Save product' : 'Update product'}">Save product</button>
            </div>
        </form>
    </main>

    <footer>
        <p>Vanilla JS Project</p>
    </footer>
</body>
</html>
