<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${category.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categories')}"></nav>

<div class="container">
    <div class="header-row">
        <h1 th:text="${category.name}">Category</h1>
        <div>
            <a th:href="@{/products}" class="btn">View All Products</a>
            <a th:href="@{/categories}" class="btn btn-secondary">All Categories</a>
        </div>
    </div>

    <div class="details-box">
        <p><strong>Description:</strong> <span th:text="${category.description ?: 'No description available.'}"></span></p>
    </div>

    <h3>Available Products in this Category</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${products}">
                <td th:text="'#' + ${p.id}"></td>
                <td><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></td>
                <td th:text="'$' + ${p.price}"></td>
                <td th:text="${p.stock} + ' units'"></td>
                <td>
                    <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-secondary btn-sm">View Details</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="5" class="empty-msg">No products found in this category.</td>
            </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
