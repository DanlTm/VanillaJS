<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categories')}"></nav>

<div class="container">
    <div class="header-row">
        <h1>Product Categories</h1>
        <a th:href="@{/products}" class="btn btn-secondary">Explore Products</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${categories}">
                <td><a th:href="@{/categories/{id}(id=${c.id})}" th:text="${c.name}" class="fw-bold"></a></td>
                <td th:text="${c.description}"></td>
                <td>
                    <a th:href="@{/categories/{id}(id=${c.id})}" class="btn btn-secondary btn-sm">View Products</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="3" class="empty-msg">No categories found.</td>
            </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
