<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categories')}"></nav>

<div class="container">
    <div class="header-row">
        <h1 th:text="${title}">Formulario de Categoría</h1>
        <a th:href="@{/categories}" class="btn btn-secondary">Volver al Listado</a>
    </div>

    <form th:action="@{/categories/save}" th:object="${category}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="name">Nombre de Categoría (*):</label>
            <input type="text" th:field="*{name}" id="name" placeholder="Ej. Componentes de PC, Consolas, Laptops" required>
            <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="description">Descripción:</label>
            <textarea th:field="*{description}" id="description" rows="3" placeholder="Breve descripción de la categoría"></textarea>
        </div>

        <div>
            <button type="submit" class="btn">Guardar Categoría</button>
            <a th:href="@{/categories}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
