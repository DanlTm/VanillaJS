<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('products')}"></nav>

<div class="container">
    <div class="header-row">
        <h1 th:text="${title}">Product Form</h1>
        <a th:href="@{/products}" class="btn btn-secondary">Back to Catalog</a>
    </div>

    <form th:action="@{/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="name">Product Name (*):</label>
            <input type="text" th:field="*{name}" id="name" placeholder="e.g. AMD Ryzen 7, Gaming Laptop, DualSense Controller" required>
            <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Price ($) (*):</label>
                <input type="number" step="0.01" min="0" th:field="*{price}" id="price" placeholder="0.00" required>
                <div class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="form-group">
                <label for="stock">Stock Quantity (*):</label>
                <input type="number" min="0" th:field="*{stock}" id="stock" placeholder="0" required>
                <div class="error-text" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Product Description:</label>
            <textarea th:field="*{description}" id="description" rows="3" placeholder="Enter specific product features and technical specifications..."></textarea>
        </div>

        <div class="form-group">
            <label for="categoryId">Category:</label>
            <select name="categoryId" id="categoryId">
                <option value="">-- Uncategorized --</option>
                <option th:each="c : ${categories}" 
                        th:value="${c.id}" 
                        th:text="${c.name}"
                        th:selected="${c.id == categoryId}">
                </option>
            </select>
        </div>

        <div>
            <button type="submit" class="btn">Save Product</button>
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
