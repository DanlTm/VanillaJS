<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('products')}"></nav>

<div class="container">
    <div class="header-row">
        <h1 th:text="${product.name}">Product Details</h1>
        <div>
            <a th:href="@{/products}" class="btn btn-secondary">Back to Catalog</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="details-box">
        <p><strong>Product ID:</strong> <span th:text="'#' + ${product.id}"></span></p>
        <p><strong>Price:</strong> <span th:text="'$' + ${product.price}"></span></p>
        <p><strong>Available Stock:</strong> <span th:text="${product.stock} + ' units'"></span></p>
        <p><strong>Category:</strong> 
            <a th:if="${product.category != null}" th:href="@{/categories/{id}(id=${product.category.id})}" th:text="${product.category.name}"></a>
            <span th:if="${product.category == null}">Uncategorized</span>
        </p>
        <p th:if="${product.description != null}">
            <strong>Description:</strong> <span th:text="${product.description}"></span>
        </p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
