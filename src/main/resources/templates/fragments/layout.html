<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Head Fragment -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Tech & Gaming Store'">Tech & Gaming Store</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<!-- Navbar Fragment (Home & Products only) -->
<nav th:fragment="navbar(active)" class="navbar">
    <a th:href="@{/}" class="brand">Tech &amp; Gaming Store</a>
    <ul class="nav-links">
        <li><a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Home</a></li>
        <li><a th:href="@{/products}" th:classappend="${active == 'products'} ? 'active'">Products</a></li>
    </ul>
</nav>

<!-- Alerts Fragment -->
<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

<!-- Footer Fragment -->
<footer th:fragment="footer">
    <p>&copy; 2026 Tech &amp; Gaming Store. PC Components, PlayStation,amp; Video Games.</p>
</footer>

</body>
</html>
